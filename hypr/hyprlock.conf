# hyprlock — ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    grace = 3
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    outer_color = rgba(122, 162, 247, 0.8)
    inner_color = rgba(20, 22, 30, 0.9)
    font_color = rgba(220, 225, 240, 1.0)
    placeholder_text = <i>Пароль...</i>
    fade_on_empty = true
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(220, 225, 240, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(160, 168, 190, 1.0)
    position = 0, 40
    halign = center
    valign = center
}
