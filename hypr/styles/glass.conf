# ─────────────────────────────────────────────
#  Стиль: GLASS — матовое стекло
#  Блюр, полупрозрачность, мягкие тени, плавность
# ─────────────────────────────────────────────

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $surface1
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        popups = true
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }

    active_opacity = 0.97
    inactive_opacity = 0.86
}

animations {
    enabled = true

    bezier = glassOut, 0.05, 0.9, 0.1, 1.05
    bezier = glassSnap, 0.23, 1, 0.32, 1
    bezier = glassSoft, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 5, glassOut, popin 85%
    animation = windowsIn, 1, 5, glassOut, popin 85%
    animation = windowsOut, 1, 4, glassSoft, popin 85%
    animation = windowsMove, 1, 4, glassSnap
    animation = layers, 1, 4, glassOut, popin 90%
    animation = layersIn, 1, 4, glassOut, popin 90%
    animation = layersOut, 1, 3, glassSoft, fade
    animation = fade, 1, 5, glassSoft
    animation = fadeLayers, 1, 4, glassSoft
    animation = border, 1, 8, default
    animation = workspaces, 1, 5, glassSnap, slidefade 20%
    animation = specialWorkspace, 1, 5, glassSnap, slidefadevert 30%
}
