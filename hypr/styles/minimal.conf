# ─────────────────────────────────────────────
#  Стиль: MINIMAL — минимализм
#  Плоские цвета, тонкие линии, быстрые фейды
# ─────────────────────────────────────────────

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = $accent
    col.inactive_border = $surface1
}

decoration {
    rounding = 4

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true

    bezier = quick, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 3, quick, fade
    animation = windowsOut, 1, 2, quick, fade
    animation = windowsMove, 1, 3, quick
    animation = layers, 1, 3, quick, fade
    animation = layersOut, 1, 2, quick, fade
    animation = fade, 1, 3, quick
    animation = fadeLayers, 1, 3, quick
    animation = border, 1, 4, default
    animation = workspaces, 1, 3, quick, fade
    animation = specialWorkspace, 1, 3, quick, fade
}
