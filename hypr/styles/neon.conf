# ─────────────────────────────────────────────
#  Стиль: NEON — неон / киберпанк
#  Свечение, градиентные рамки, пружинные анимации
# ─────────────────────────────────────────────

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    col.active_border = $accent $accent2 $accent 270deg
    col.inactive_border = $surface1
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        popups = true
    }

    shadow {
        enabled = true
        range = 25
        render_power = 4
        color = $accent
    }

    active_opacity = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true

    bezier = overshoot, 0.05, 0.9, 0.1, 1.15
    bezier = bounce, 0.68, -0.3, 0.32, 1.3
    bezier = neonSnap, 0.16, 1, 0.3, 1

    animation = windows, 1, 6, overshoot, popin 70%
    animation = windowsIn, 1, 6, bounce, popin 70%
    animation = windowsOut, 1, 4, neonSnap, popin 80%
    animation = windowsMove, 1, 5, neonSnap
    animation = layers, 1, 5, overshoot, popin 80%
    animation = layersIn, 1, 5, overshoot, popin 80%
    animation = layersOut, 1, 3, neonSnap, fade
    animation = fade, 1, 5, neonSnap
    animation = fadeLayers, 1, 4, neonSnap
    animation = border, 1, 10, default
    animation = borderangle, 1, 50, default, loop
    animation = workspaces, 1, 6, overshoot, slidefade 30%
    animation = specialWorkspace, 1, 6, bounce, slidefadevert 40%
}
