# ─────────────────────────────────────────────
#  Hyprland — main config
#  ~/.config/hypr/hyprland.conf
# ─────────────────────────────────────────────

# Цвета генерируются скриптом scripts/theme.sh
source = ~/.config/hypr/colors.conf
# Стиль (glass/minimal/neon) переключается scripts/style.sh — SUPER+S
source = ~/.config/hypr/style.conf

# ── Мониторы ─────────────────────────────────
monitor = , preferred, auto, 1

# ── Автозапуск ───────────────────────────────
exec-once = waybar
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper.sh --restore
exec-once = eww -c ~/.config/eww daemon
exec-once = hypridle
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ── Переменные окружения ─────────────────────
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ── Ввод ─────────────────────────────────────
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Общее ────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $surface1
    layout = dwindle
    resize_on_border = true
}

# ── Декорации ────────────────────────────────
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000055)
    }

    active_opacity = 1.0
    inactive_opacity = 0.93
}

# ── Анимации (база; стиль переопределяет их в style.conf) ──
animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    bezier = snappy, 0.23, 1, 0.32, 1

    animation = windows, 1, 5, smooth, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = windowsMove, 1, 4, snappy
    animation = layers, 1, 4, smooth, popin 90%
    animation = layersOut, 1, 3, smooth, fade
    animation = fade, 1, 5, default
    animation = fadeLayers, 1, 4, default
    animation = border, 1, 8, default
    animation = workspaces, 1, 4, snappy, slidefade 20%
    animation = specialWorkspace, 1, 5, snappy, slidefadevert 30%
}

# ── Раскладки ────────────────────────────────
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── Жесты (Hyprland 0.51+ синтаксис) ─────────
gestures {
    gesture = 3, horizontal, workspace
}

# ── Хоткеи ───────────────────────────────────
$mod = SUPER
$terminal = kitty
$menu = rofi -show drun
$browser = firefox

bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, $terminal -e yazi
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, L, exec, hyprlock

# Панель настроек (тема / стиль / обои / шрифт)
bind = $mod, T, exec, ~/.config/hypr/scripts/settings.sh toggle
# Пипетка: выбрать цвет из спектра на экране
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/theme-picker.sh

# Скриншоты
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, grim - | wl-copy

# Буфер обмена
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Фокус
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Перемещение окон
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Рабочие столы
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Мышь
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Громкость и яркость
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Медиа
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause

# ── Правила окон (Hyprland 0.53+ синтаксис) ──
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:class .*, suppress_event maximize

# ── Правила слоёв: блюр и анимации панелей ───
layerrule {
    name = waybar_glass
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.2
    animation = slide top
}

layerrule {
    name = rofi_glass
    match:namespace = rofi
    blur = true
    ignore_alpha = 0.2
    animation = popin
}

layerrule {
    name = dunst_glass
    match:namespace = dunst
    blur = true
    ignore_alpha = 0.2
    animation = slide right
}

layerrule {
    name = notifications_glass
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.2
    animation = slide right
}

# Панель настроек eww: блюр + мягкое затухание
# (выезд делает revealer внутри eww)
layerrule {
    name = eww_settings
    match:namespace = settings
    blur = true
    ignore_alpha = 0.1
    animation = fade
}
